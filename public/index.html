<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Source To-Do App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Components will be injected here by other members -->
        <header id="main-header"></header>
        
        <main id="main-content">
            <!-- Search Bar will go here (Issue #19) -->
            <div id="search-container"></div>

            <!-- Input Section (Issue #5 & #11) -->
            <div id="input-section"></div>

            <!-- Task List (Issue #10) -->
            <ul id="task-list"></ul>
            
            <!-- Empty State (Issue #17) -->
            <div id="empty-state"></div>
            
            <!-- Filter Controls (Issue #13) -->
            <div id="filter-controls"></div>
        </main>

        <footer id="main-footer" style="text-align: center; padding: 30px; background-color: #f9f9f9; border-top: 1px solid #ddd; margin-top: 40px;">
            <p style="margin: 5px 0; font-size: 14px; color: #666;">Empowering productivity through open-source collaboration.</p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
