<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Source To-Do App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Components will be injected here by other members -->
        <header id="main-header"></header>
        
        <main id="main-content">
            <!-- Search Bar will go here (Issue #19) -->
            <div id="search-container"></div>

            <!-- Input Section (Issue #5 & #11) -->
          <div id="input-section" style="margin-bottom: 20px; display: flex; gap: 10px;">
<input type="text" id="task-input" placeholder="Enter a new task..." style="flex: 1; padding: 10px; font-size: 16px;">
<button id="add-task-btn" style="padding: 10px 20px; font-size: 16px; cursor: pointer;">Add Task</button>
</div>

            <!-- Task List (Issue #10) -->
            <ul id="task-list"></ul>
            
            <!-- Empty State (Issue #17) -->
            <div id="empty-state"></div>
            
            <!-- Filter Controls (Issue #13) -->
            <div id="filter-controls"></div>
        </main>

        <footer id="main-footer"></footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
